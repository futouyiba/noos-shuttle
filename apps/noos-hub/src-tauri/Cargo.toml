[package]
name = "noos-hub"
version = "0.1.6"
description = "NOOS Hub desktop control plane"
authors = ["FuTou 2026"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Serves the evaluator proxy (#100 slice 2). rustls-no-provider matches the
# exact feature set tauri-plugin-updater already compiles reqwest with (the
# process-level crypto provider comes from tauri), so this edge adds no new
# crates; both "rustls" (aws-lc-rs + quinn) and default/native-tls pull in
# trees the build never had.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
